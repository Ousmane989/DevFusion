<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produits — DevFusion Pro</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sb-bd"></div>
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="brand" data-no-transition><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 16 3-8 6 3 5-7 6 4-2 8H4z"/></svg></span> DevFusion</a>
    <div class="side-label">Pilotage</div>
    <nav class="side-nav">
      <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Vue d'ensemble</a>
      <a href="admin-produits.html" class="is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg> Produits</a>
      <a href="admin-commandes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg> Commandes</a>
      <a href="admin-clients.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg> Clients</a>
      <div class="side-sep"></div>
      <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg> Retour au site</a>
    </nav>
  </aside>

  <div>
    <div class="topbar">
      <button class="icon-btn side-toggle" id="sb-open" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="input" placeholder="Rechercher un produit…"></div>
      <button class="btn btn-sm" data-modal-open="prod-modal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Ajouter</button>
      <div class="avatar">OB</div>
    </div>

    <div class="main-area page-fade">
      <div class="page-title reveal"><h1>Produits</h1><p>Gérez votre catalogue.</p></div>

      <div class="panel reveal">
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Statut</th><th style="text-align:right">Actions</th></tr></thead>
            <tbody id="prod-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modale ajout/édition produit avec dropzone (section 11) -->
<div class="modal-backdrop" id="prod-modal">
  <div class="modal" style="max-width:540px">
    <div class="modal-head"><h3 id="pm-title">Ajouter un produit</h3><button class="icon-btn" data-modal-close aria-label="Fermer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="dropzone" id="dz">
      <svg class="dz-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      <strong>Glissez une image ici</strong><br><span style="font-size:.85rem">ou cliquez pour parcourir</span>
    </div>
    <div class="field" style="margin-top:16px"><label>Nom</label><input class="input" id="pm-name" placeholder="Air Fusion 02"></div>
    <div class="grid grid-2">
      <div class="field"><label>Prix (€)</label><input class="input" placeholder="149"></div>
      <div class="field"><label>Stock</label><input class="input" placeholder="120"></div>
    </div>
    <div class="flex gap" style="margin-top:6px"><button class="btn btn-outline" style="flex:1" data-modal-close>Annuler</button><button class="btn" style="flex:1" id="pm-save">Enregistrer</button></div>
  </div>
</div>

<!-- Modale confirmation suppression -->
<div class="modal-backdrop" id="del-modal">
  <div class="modal" style="max-width:400px;text-align:center">
    <div style="width:60px;height:60px;border-radius:50%;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;margin:0 auto 14px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></div>
    <h3>Supprimer ce produit&nbsp;?</h3>
    <p style="margin-top:6px">Cette action est irréversible.</p>
    <div class="flex gap" style="margin-top:18px"><button class="btn btn-outline" style="flex:1" data-modal-close>Annuler</button><button class="btn btn-danger" style="flex:1" id="del-confirm" data-modal-close>Supprimer</button></div>
  </div>
</div>

<script src="js/animations.js"></script>
<script src="js/ui.js"></script>
<script>
  var sb = document.getElementById("sidebar"), bd = document.getElementById("sb-bd");
  document.getElementById("sb-open").addEventListener("click", function(){ sb.classList.add("open"); bd.classList.add("open"); });
  bd.addEventListener("click", function(){ sb.classList.remove("open"); bd.classList.remove("open"); });

  var PRODS = [
    { n:"Air Fusion 01", c:"Running", p:"149 €", s:120, st:"done", stl:"Actif" },
    { n:"Urbano Low", c:"Lifestyle", p:"129 €", s:64, st:"done", stl:"Actif" },
    { n:"Pace X Runner", c:"Running", p:"169 €", s:8, st:"pending", stl:"Stock bas" },
    { n:"Volta Court", c:"Basketball", p:"139 €", s:0, st:"canceled", stl:"Rupture" },
    { n:"North Trail", c:"Running", p:"159 €", s:210, st:"done", stl:"Actif" }
  ];
  var tbody = document.getElementById("prod-tbody");
  function render(){
    tbody.innerHTML = PRODS.map(function(p,i){
      return '<tr class="row-in" style="animation-delay:'+(i*60)+'ms">'
        + '<td><div class="avatar-row"><div class="o-thumb" style="width:40px;height:40px;border-radius:10px">'+p.n.charAt(0)+'</div><strong>'+p.n+'</strong></div></td>'
        + '<td>'+p.c+'</td><td>'+p.p+'</td><td>'+p.s+'</td>'
        + '<td><span class="status '+p.st+'">'+p.stl+'</span></td>'
        + '<td style="text-align:right"><button class="icon-btn" title="Modifier" onclick="editProd(\''+p.n+'\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>'
        + '<button class="icon-btn" title="Supprimer" onclick="askDelete(this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></td></tr>';
    }).join("");
  }
  render();

  window.editProd = function(name){
    document.getElementById("pm-title").textContent = "Modifier le produit";
    document.getElementById("pm-name").value = name;
    DFModal.open("prod-modal");
  };
  document.querySelector("[data-modal-open='prod-modal']").addEventListener("click", function(){
    document.getElementById("pm-title").textContent = "Ajouter un produit";
    document.getElementById("pm-name").value = "";
  });
  document.getElementById("pm-save").addEventListener("click", function(){
    var btn = this; btn.classList.add("is-loading");
    setTimeout(function(){ btn.classList.remove("is-loading"); DFModal.close("prod-modal"); DFToast.success("Enregistré", "Le produit a été sauvegardé."); }, 1000);
  });

  // Suppression : ligne ciblée
  var targetRow = null;
  window.askDelete = function(el){ targetRow = el.closest("tr"); DFModal.open("del-modal"); };
  document.getElementById("del-confirm").addEventListener("click", function(){
    if (!targetRow) return;
    targetRow.style.transition = "opacity .3s, transform .3s";
    targetRow.style.opacity = "0"; targetRow.style.transform = "translateX(24px)";
    setTimeout(function(){ targetRow.remove(); targetRow = null; DFToast.info("Produit supprimé"); }, 300);
  });

  // Dropzone (upload visuel)
  var dz = document.getElementById("dz");
  ["dragenter","dragover"].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add("drag"); }); });
  ["dragleave","drop"].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove("drag"); }); });
  dz.addEventListener("drop", function(){ DFToast.success("Image ajoutée", "Aperçu prêt."); });
  dz.addEventListener("click", function(){ DFToast.info("Sélecteur de fichier", "Démo — aucun fichier réel."); });
</script>
</body>
</html>

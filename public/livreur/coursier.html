<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karat Logistique</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/png" href="/livreur/img/icon.png?v=2" />
  <script src="/livreur/theme.js?v=20261111a"></script>
  <link rel="stylesheet" href="/livreur/livreur.css?v=20261111a" />
</head>
<body>
  <div class="app">
    <aside class="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
        <h1>Espace livreur</h1>
        <div class="actions"><button class="btn btn-ghost btn-sm" id="c-refresh">Actualiser</button></div>
      </header>
      <div class="content">
        <a class="app-dl hidden" id="c-app" href="/livreur/app/karat-livreur.apk" download><span class="ic"></span><span><b>Installez l'application Karat Livreur</b><small>Votre position reste partagée même téléphone verrouillé · Android</small></span><span class="btn btn-primary btn-sm">Télécharger</span></a>
        <div class="geo-banner" id="c-geo"><span class="dot"></span><span id="c-geo-text">Localisation en cours d'activation…</span></div>
        <div data-view="tournee" class="hidden">
          <div class="kpis" id="c-kpis"></div>
          <div class="panel flush" id="c-avail-panel">
            <div class="panel-head"><h2>Commandes confirmées à livrer</h2><div class="actions"><span class="live-badge"><i></i>En direct</span></div></div>
            <div class="list-cards" id="c-avail" style="padding:0 18px 18px"></div>
          </div>
          <h2 style="font-size:18px;margin-bottom:12px">À livrer</h2>
          <div class="list-cards" id="c-active"></div>
          <h2 style="font-size:18px;margin:28px 0 12px">Terminées aujourd'hui</h2>
          <div class="list-cards" id="c-done"></div>
        </div>
        <div data-view="caisse" class="hidden">
          <div class="kpis" id="c-cash-kpis"></div>
          <div class="panel flush">
            <div class="panel-head"><h2>Encaissements à remettre à l'agence</h2></div>
            <div class="table-wrap" id="c-cash-list"></div>
          </div>
          <div class="panel flush">
            <div class="panel-head"><h2>Remises effectuées</h2></div>
            <div class="table-wrap" id="c-remits"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/livreur/lv.js?v=20261111a"></script>
  <script src="/livreur/anim.js?v=20261111a"></script>
  <script src="/livreur/coursier.js?v=20261111a"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace partenaire — Karat Livreur</title>
  <meta name="description" content="Connectez-vous à votre espace partenaire Karat Livreur : commandes, suivi, stock et reversements." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.svg" />
  <script src="/livreur/theme.js?v=20261019c"></script>
  <link rel="stylesheet" href="/livreur/livreur.css?v=20261019c" />
</head>
<body>
  <div id="lv-header"></div>
  <header class="page-hero"><div class="container"><span class="eyebrow">Espace partenaire</span><h1>Bon retour parmi nous</h1><p>Connectez-vous pour créer vos commandes, suivre vos colis, votre stock et votre argent.</p></div></header>
  <main class="page-narrow page-body">
    <form class="card" id="login-form">
      <div class="form-msg"></div>
      <div class="field"><label>Téléphone</label><input name="phone" type="tel" required autocomplete="username" placeholder="22 22 22 22" /></div>
      <div class="field"><label>Mot de passe</label><input name="password" type="password" required autocomplete="current-password" /></div>
      <button class="btn btn-primary btn-block" type="submit">Accéder à mon espace partenaire</button>
      <p class="muted" style="font-size:13.5px;margin-top:14px;text-align:center">Mot de passe oublié ? Contactez l'agence sur <a class="gold" data-contact="wa" href="#" target="_blank" rel="noopener">WhatsApp</a>.</p>
    </form>
    <p class="auth-switch">Pas encore de compte ? <a href="/livreur/inscription">Devenir partenaire</a></p>
    <p class="auth-switch" style="margin-top:8px">Vous faites partie de l'équipe ? <a href="/livreur/agence/connexion">Espace agence</a></p>
  </main>
  <div id="lv-footer"></div>
  <script src="/livreur/lv.js?v=20261019c"></script>
  <script src="/livreur/anim.js?v=20261019c"></script>
  <script>
  (function () {
    'use strict';
    LV.publicChrome();
    var form = document.getElementById('login-form');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var r = await LV.submit(form, '/login', { space: 'partenaire' });
      if (!r.ok) return;
      var suite = new URLSearchParams(location.search).get('suite');
      location.href = suite && suite.indexOf('/livreur/partenaire') === 0 ? suite : r.data.redirect;
    });
  })();
  </script>
</body>
</html>

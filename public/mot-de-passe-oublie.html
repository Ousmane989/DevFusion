<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublié — Karat</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Karat" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <aside class="auth-aside">
      <div class="aside-glow"></div>
      <a href="/" class="brand"><svg class="mark" viewBox="0 0 32 32"><defs><linearGradient id="kmark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5D77E"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#B8901F"/></linearGradient></defs><polygon points="16,3 27,12 22,28 10,28 5,12" fill="url(#kmark)"/><polygon points="16,3 27,12 16,16 5,12" fill="#fff" opacity=".18"/></svg><span class="gold-text">Karat</span></a>
      <div class="aside-body">
        <h2>Récupérez l'accès à votre <span class="gold-text">boutique</span>.</h2>
        <p>Indiquez votre e-mail : nous vous enverrons un code pour définir un nouveau mot de passe en toute sécurité.</p>
      </div>
      <p class="aside-foot">Vos données restent protégées.</p>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <a href="/connexion" class="auth-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg> Retour à la connexion</a>
        <h1>Mot de passe oublié</h1>
        <p class="lead">Nous vous enverrons un code de réinitialisation.</p>

        <div class="form-msg" id="msg"></div>

        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="email">Adresse e-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.com" />
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Envoyer le code</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script>
    (function () {
      const form = document.getElementById('forgot-form');
      const msgEl = document.getElementById('msg');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        Karat.clearMsg(msgEl);
        const email = form.email.value.trim();
        if (!email) { Karat.msg(msgEl, 'error', 'Indiquez votre adresse e-mail.'); return; }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Envoi…';
        const { data } = await Karat.api('/api/auth/forgot', { email });
        btn.disabled = false;
        btn.textContent = 'Envoyer le code';

        sessionStorage.setItem('karat_reset_email', email);
        Karat.msg(msgEl, 'success', 'Si un compte existe, un code a été envoyé par e-mail. Redirection…');
        setTimeout(() => { window.location.href = '/reinitialiser'; }, 1100);
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublié — Karat</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Karat" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <aside class="auth-aside">
      <div class="aside-glow"></div>
      <a href="/" class="brand"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="kgem"><polygon points="36,25 64,25 84,44 50,86 16,44"/></clipPath><linearGradient id="ksheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><polygon points="36,25 16,44 31,44" fill="#eed07a"/><polygon points="36,25 64,25 69,44 31,44" fill="#f8e59a"/><polygon points="64,25 84,44 69,44" fill="#dcb64a"/><polygon points="16,44 31,44 50,86" fill="#e4c25a"/><polygon points="31,44 50,44 50,86" fill="#d4af37"/><polygon points="50,44 69,44 50,86" fill="#c9a231"/><polygon points="69,44 84,44 50,86" fill="#b8901f"/><polygon points="36,25 64,25 55,32 42,32" fill="#fff" opacity=".28"/><g fill="none" stroke="#5c460f" stroke-width="1.1" stroke-linejoin="round" opacity=".38"><polygon points="36,25 64,25 84,44 50,86 16,44"/><line x1="16" y1="44" x2="84" y2="44"/><line x1="36" y1="25" x2="31" y2="44"/><line x1="64" y1="25" x2="69" y2="44"/><line x1="31" y1="44" x2="50" y2="86"/><line x1="50" y1="44" x2="50" y2="86"/><line x1="69" y1="44" x2="50" y2="86"/></g><g clip-path="url(#kgem)"><rect class="mark-sheen" x="0" y="0" width="26" height="100" fill="url(#ksheen)"/></g><g transform="translate(45 31)"><path class="mark-glint" d="M0,-7 L1.6,-1.6 7,0 1.6,1.6 0,7 -1.6,1.6 -7,0 -1.6,-1.6 Z" fill="#fff"/></g></svg><span class="gold-text">Karat</span></a>
      <div class="aside-body">
        <h2>Récupérez l'accès à votre <span class="gold-text">boutique</span>.</h2>
        <p>Indiquez votre e-mail : nous vous enverrons un code pour définir un nouveau mot de passe en toute sécurité.</p>
      </div>
      <p class="aside-foot">Vos données restent protégées.</p>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <a href="/connexion" class="auth-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg> Retour à la connexion</a>
        <h1>Mot de passe oublié</h1>
        <p class="lead">Nous vous enverrons un code de réinitialisation.</p>

        <div class="form-msg" id="msg"></div>

        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="email">Adresse e-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.com" />
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Envoyer le code</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script>
    (function () {
      const form = document.getElementById('forgot-form');
      const msgEl = document.getElementById('msg');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        Karat.clearMsg(msgEl);
        const email = form.email.value.trim();
        if (!email) { Karat.msg(msgEl, 'error', 'Indiquez votre adresse e-mail.'); return; }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Envoi…';
        const { data } = await Karat.api('/api/auth/forgot', { email });
        btn.disabled = false;
        btn.textContent = 'Envoyer le code';

        sessionStorage.setItem('karat_reset_email', email);
        Karat.msg(msgEl, 'success', 'Si un compte existe, un code a été envoyé par e-mail. Redirection…');
        setTimeout(() => { window.location.href = '/reinitialiser'; }, 1100);
      });
    })();
  </script>
</body>
</html>

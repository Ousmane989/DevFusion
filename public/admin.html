<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Karat</title>
  <link rel="icon" href="/favicon.svg" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .admin { min-height: 100vh; }
    .adm-top { position: sticky; top: 0; z-index: 20; background: rgba(13,13,13,.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line); }
    .adm-top-in { max-width: 1240px; margin: 0 auto; padding: 14px 22px; display: flex; align-items: center; gap: 14px; }
    .adm-brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 1.35rem; font-weight: 600;
      background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .adm-brand svg { width: 30px; height: 30px; }
    .adm-tag { font-family: var(--sans); font-size: .62rem; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--gold-light); border: 1px solid var(--line); border-radius: 50px; padding: 3px 10px; }
    .adm-top .spacer { flex: 1; }
    .adm-back { font-family: var(--sans); font-size: .85rem; color: var(--text-dim); text-decoration: none;
      border: 1px solid var(--line); border-radius: 50px; padding: 8px 16px; transition: all .2s; }
    .adm-back:hover { border-color: var(--gold); color: var(--gold-light); }

    .adm-wrap { max-width: 1240px; margin: 0 auto; padding: 30px 22px 90px; }
    .adm-h1 { font-family: var(--serif); font-size: 2.1rem; font-weight: 600; }
    .adm-sub { color: var(--text-mute); margin-bottom: 26px; }

    .adm-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 26px; }
    .adm-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
    .adm-card .lab { font-size: .7rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-mute); }
    .adm-card .val { font-family: var(--serif); font-size: 2rem; font-weight: 600; color: var(--text); margin-top: 4px; }
    .adm-card .val.gold { color: var(--gold-light); }
    .adm-card .val.warn { color: var(--danger); }

    .adm-toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .adm-toolbar input, .adm-toolbar select { background: var(--bg-soft); border: 1px solid var(--line); color: var(--text);
      font-family: var(--sans); font-size: .9rem; padding: 10px 14px; border-radius: var(--radius-sm); }
    .adm-toolbar input { flex: 1; min-width: 200px; }
    .adm-toolbar input:focus, .adm-toolbar select:focus { outline: none; border-color: var(--gold); }

    .adm-table-wrap { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .adm-scroll { overflow-x: auto; }
    table.adm { width: 100%; border-collapse: collapse; min-width: 820px; }
    table.adm th { text-align: left; font-family: var(--sans); font-weight: 500; font-size: .72rem; letter-spacing: .5px;
      text-transform: uppercase; color: var(--text-mute); padding: 14px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.adm td { padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: .9rem; color: var(--text-dim); vertical-align: middle; }
    table.adm tbody tr { cursor: pointer; transition: background .2s; }
    table.adm tbody tr:hover { background: rgba(255,255,255,.025); }
    table.adm tbody tr:last-child td { border-bottom: none; }
    .adm-name { color: var(--text); font-weight: 500; }
    .adm-shop { color: var(--text-mute); font-size: .8rem; }
    .adm-mono { font-variant-numeric: tabular-nums; }
    .adm-num { text-align: right; font-variant-numeric: tabular-nums; }

    .badge { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 500; padding: 4px 10px;
      border-radius: 50px; border: 1px solid transparent; white-space: nowrap; }
    .badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .badge.ok { color: var(--success); background: rgba(111,191,139,.1); border-color: rgba(111,191,139,.3); }
    .badge.no { color: var(--danger); background: rgba(229,103,95,.1); border-color: rgba(229,103,95,.3); }
    .badge.trial { color: var(--gold-light); background: rgba(212,175,55,.1); border-color: rgba(212,175,55,.3); }

    .flag { font-size: .78rem; color: var(--text-mute); }

    .adm-empty, .adm-loading { text-align: center; padding: 50px 20px; color: var(--text-mute); }

    /* Fiche détaillée (fenêtre) */
    .adm-modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: flex-start; justify-content: center;
      padding: 40px 16px; background: rgba(0,0,0,.65); backdrop-filter: blur(3px); overflow-y: auto; }
    .adm-modal.open { display: flex; }
    .adm-box { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); width: 100%;
      max-width: 520px; padding: 26px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
    .adm-box h3 { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; }
    .adm-box .adm-shop { margin-bottom: 18px; }
    .adm-row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .adm-row:last-child { border-bottom: none; }
    .adm-row .k { color: var(--text-mute); font-size: .84rem; }
    .adm-row .v { color: var(--text); text-align: right; word-break: break-word; }
    .adm-row .v a { color: var(--gold-light); text-decoration: none; }
    .adm-close { float: right; background: none; border: 1px solid var(--line); color: var(--text-dim); width: 34px; height: 34px;
      border-radius: 50%; cursor: pointer; font-size: 1.1rem; line-height: 1; }
    .adm-close:hover { border-color: var(--gold); color: var(--gold-light); }
    .adm-shoplist { margin-top: 6px; }
    .adm-shoplist span { display: inline-block; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 50px;
      padding: 3px 10px; font-size: .76rem; color: var(--text-dim); margin: 3px 4px 0 0; }

    .adm-actions { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .adm-act-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .btn-adm { flex: 1; min-width: 120px; font-family: var(--sans); font-size: .84rem; font-weight: 500; padding: 10px 12px;
      border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--line); background: var(--bg-soft); color: var(--text); transition: all .2s; }
    .btn-adm:hover { transform: translateY(-1px); }
    .btn-adm.gold { background: var(--gold-grad); color: #1a1400; border-color: transparent; font-weight: 600; }
    .btn-adm.ghost { color: var(--text-dim); }
    .btn-adm.ghost:hover { border-color: var(--gold); color: var(--gold-light); }
    .btn-adm.danger { color: var(--danger); border-color: rgba(229,103,95,.35); background: rgba(229,103,95,.08); }
    .adm-act-msg { font-size: .85rem; min-height: 20px; color: var(--text-mute); }
    .adm-act-msg.ok { color: var(--success); }
    .adm-act-msg.err { color: var(--danger); }

    @media (max-width: 560px) {
      .adm-wrap { padding: 22px 14px 80px; }
      .adm-h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <div class="admin">
    <header class="adm-top">
      <div class="adm-top-in">
        <span class="adm-brand">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <polygon points="36,25 64,25 84,44 50,86 16,44" fill="none" stroke="#d4af37" stroke-width="3" stroke-linejoin="round"/>
            <line x1="16" y1="44" x2="84" y2="44" stroke="#d4af37" stroke-width="2"/>
            <line x1="36" y1="25" x2="31" y2="44" stroke="#d4af37" stroke-width="2"/>
            <line x1="64" y1="25" x2="69" y2="44" stroke="#d4af37" stroke-width="2"/>
            <line x1="31" y1="44" x2="50" y2="86" stroke="#d4af37" stroke-width="2"/>
            <line x1="69" y1="44" x2="50" y2="86" stroke="#d4af37" stroke-width="2"/>
          </svg>
          Karat
        </span>
        <span class="adm-tag">Admin</span>
        <span class="spacer"></span>
        <a class="adm-back" href="/tableau-de-bord">← Tableau de bord</a>
      </div>
    </header>

    <main class="adm-wrap">
      <h1 class="adm-h1">Personnes inscrites</h1>
      <p class="adm-sub">Toutes les personnes inscrites sur Karat, leurs coordonnées et l'état de leur abonnement.</p>

      <div class="adm-cards" id="adm-cards"></div>

      <div class="adm-toolbar">
        <input id="adm-search" type="search" placeholder="Rechercher un nom, une boutique, un e-mail, un téléphone…" />
        <select id="adm-country">
          <option value="">Tous les pays</option>
          <option value="SN">🇸🇳 Sénégal</option>
          <option value="MR">🇲🇷 Mauritanie</option>
        </select>
        <select id="adm-billing">
          <option value="">Tout état</option>
          <option value="ok">À jour</option>
          <option value="no">Pas à jour</option>
        </select>
      </div>

      <div class="adm-table-wrap">
        <div class="adm-scroll">
          <table class="adm">
            <thead>
              <tr>
                <th>Commerçant</th>
                <th>Téléphone</th>
                <th>E-mail</th>
                <th>Pays</th>
                <th class="adm-num">Boutiques</th>
                <th class="adm-num">Commandes</th>
                <th>Inscrit le</th>
                <th>Abonnement</th>
              </tr>
            </thead>
            <tbody id="adm-rows">
              <tr><td colspan="8" class="adm-loading">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Fiche détaillée -->
    <div class="adm-modal" id="adm-modal">
      <div class="adm-box" id="adm-box"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>

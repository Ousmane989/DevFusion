<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Se connecter — Karat</title>
  <link rel="icon" href="/favicon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Karat" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <aside class="auth-aside">
      <div class="aside-glow"></div>
      <a href="/" class="brand"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="kgem"><polygon points="36,25 64,25 84,44 50,86 16,44"/></clipPath><linearGradient id="ksheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><polygon points="36,25 16,44 31,44" fill="#eed07a"/><polygon points="36,25 64,25 69,44 31,44" fill="#f8e59a"/><polygon points="64,25 84,44 69,44" fill="#dcb64a"/><polygon points="16,44 31,44 50,86" fill="#e4c25a"/><polygon points="31,44 50,44 50,86" fill="#d4af37"/><polygon points="50,44 69,44 50,86" fill="#c9a231"/><polygon points="69,44 84,44 50,86" fill="#b8901f"/><polygon points="36,25 64,25 55,32 42,32" fill="#fff" opacity=".28"/><g fill="none" stroke="#5c460f" stroke-width="1.1" stroke-linejoin="round" opacity=".38"><polygon points="36,25 64,25 84,44 50,86 16,44"/><line x1="16" y1="44" x2="84" y2="44"/><line x1="36" y1="25" x2="31" y2="44"/><line x1="64" y1="25" x2="69" y2="44"/><line x1="31" y1="44" x2="50" y2="86"/><line x1="50" y1="44" x2="50" y2="86"/><line x1="69" y1="44" x2="50" y2="86"/></g><g clip-path="url(#kgem)"><rect class="mark-sheen" x="0" y="0" width="26" height="100" fill="url(#ksheen)"/></g></svg><span class="gold-text">Karat</span></a>
      <div class="aside-body">
        <h2>Ravis de vous <span class="gold-text">revoir</span>.</h2>
        <p>Connectez-vous pour retrouver votre boutique, suivre vos ventes et gérer vos produits.</p>
      </div>
      <p class="aside-foot">« Votre commerce, à la mesure de l'or. »</p>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <a href="/" class="auth-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg> Retour à l'accueil</a>
        <h1>Se connecter</h1>
        <p class="lead">Pas encore de boutique ? <a href="/inscription" class="link-gold">Créer un compte</a></p>

        <div class="form-msg" id="msg"></div>

        <form id="login-form" novalidate>
          <div class="field" data-field="email">
            <label for="email">Adresse e-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.com" />
          </div>
          <div class="field" data-field="password">
            <div class="field-inline">
              <label for="password">Mot de passe</label>
              <a href="/mot-de-passe-oublie" class="link-gold" style="font-size:.82rem">Mot de passe oublié ?</a>
            </div>
            <div class="pw-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe" />
              <button type="button" class="pw-toggle" aria-label="Afficher le mot de passe">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Se connecter</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script>
    (function () {
      Karat.bindPwToggles();
      const form = document.getElementById('login-form');
      const msgEl = document.getElementById('msg');
      const btn = document.getElementById('submit-btn');
      const suite = Karat.qs('suite') || '/tableau-de-bord';

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        Karat.clearMsg(msgEl);
        const payload = { email: form.email.value.trim(), password: form.password.value };
        if (!payload.email || !payload.password) { Karat.msg(msgEl, 'error', 'Renseignez votre e-mail et votre mot de passe.'); return; }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Connexion…';
        const { ok, data } = await Karat.api('/api/auth/login', payload);
        btn.disabled = false;
        btn.textContent = 'Se connecter';

        if (!ok) {
          if (data.needsVerification) {
            sessionStorage.setItem('karat_email', data.email || payload.email);
            Karat.msg(msgEl, 'info', 'Votre e-mail n\'est pas encore vérifié. Redirection…');
            setTimeout(() => { window.location.href = '/verification'; }, 900);
            return;
          }
          Karat.msg(msgEl, 'error', data.error || 'Connexion impossible.');
          return;
        }

        // Un compte verrouillé est dirigé vers le paiement, sinon le tableau de bord.
        const dest = data.user && data.user.status === 'locked' ? '/paiement' : suite;
        window.location.href = dest;
      });
    })();
  </script>
</body>
</html>

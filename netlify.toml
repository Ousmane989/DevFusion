# Configuration Netlify — Karat (application Express en fonction serverless)
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  # Node File Trace : conserve l'arborescence des fichiers (lecture de
  # public/boutique.html pour l'Open Graph, etc.).
  node_bundler = "nft"
  included_files = ["public/**", "src/**"]

# En-têtes de sécurité aussi sur les fichiers servis directement par le CDN
# (pages HTML statiques) — ils ne passent pas par Express.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com"

# Le service worker ne doit pas être mis en cache longtemps (mises à jour).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Type MIME correct pour le manifeste PWA (installation sur l'écran d'accueil).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Les fichiers statiques (css, js, html) sont servis par le CDN ; tout le
# reste (API, pages rendues côté serveur, vitrine) va vers la fonction.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200

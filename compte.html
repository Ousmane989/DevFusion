<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon compte — DevFusion</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="app-shell">
  <!-- Sidebar client -->
  <div class="sidebar-backdrop" id="sb-bd"></div>
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="brand" data-no-transition><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 16 3-8 6 3 5-7 6 4-2 8H4z"/></svg></span> DevFusion</a>
    <nav class="side-nav">
      <a href="compte.html" class="is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg> Tableau de bord</a>
      <a href="#" data-view="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg> Mes commandes</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg> Favoris</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg> Adresses</a>
      <div class="side-sep"></div>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg> Paramètres</a>
      <a href="connexion.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Déconnexion</a>
    </nav>
    <div style="margin-top:auto" class="card" style="padding:16px;text-align:center">
      <p style="font-size:.85rem">Passez à <strong>DevFusion+</strong> pour la livraison gratuite illimitée.</p>
      <button class="btn btn-sm btn-block" style="margin-top:10px">Découvrir</button>
    </div>
  </aside>

  <!-- Contenu -->
  <div>
    <div class="topbar">
      <button class="icon-btn side-toggle" id="sb-open" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="input" placeholder="Rechercher une commande…"></div>
      <button class="icon-btn" aria-label="Notifications" style="position:relative" onclick="DFToast.info('Notification','Votre colis #DF-0847 a été expédié.')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span style="position:absolute;top:8px;right:9px;width:8px;height:8px;background:var(--danger);border-radius:50%"></span></button>
      <div class="avatar">AD</div>
    </div>

    <div class="main-area page-fade">
      <div class="page-title reveal">
        <h1>Bonjour, Awa 👋</h1>
        <p>Voici un aperçu de votre activité.</p>
      </div>

      <!-- Cartes statistiques (compteurs) -->
      <div class="stat-grid stagger">
        <div class="stat-card reveal"><div class="s-head"><span class="s-ic" style="background:var(--accent-soft);color:var(--accent)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg></span></div><div class="s-val"><span class="count" data-to="14">0</span></div><div class="s-lbl">Commandes</div></div>
        <div class="stat-card reveal"><div class="s-head"><span class="s-ic" style="background:var(--success-soft);color:var(--success)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span></div><div class="s-val"><span class="count" data-to="1248" data-suffix=" €">0</span></div><div class="s-lbl">Total dépensé</div></div>
        <div class="stat-card reveal"><div class="s-head"><span class="s-ic" style="background:var(--danger-soft);color:var(--danger)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg></span></div><div class="s-val"><span class="count" data-to="27">0</span></div><div class="s-lbl">Favoris</div></div>
        <div class="stat-card reveal"><div class="s-head"><span class="s-ic" style="background:var(--warning-soft);color:var(--warning)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></svg></span></div><div class="s-val"><span class="count" data-to="860">0</span></div><div class="s-lbl">Points fidélité</div></div>
      </div>

      <!-- Commandes récentes -->
      <div class="panel reveal" style="margin-top:24px">
        <div class="panel-head"><h3>Commandes récentes</h3><a href="#" class="link-underline" style="color:var(--accent);font-size:.9rem">Tout voir</a></div>
        <div class="grid" id="orders-list" style="gap:12px"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/animations.js"></script>
<script src="js/ui.js"></script>
<script>
  // Sidebar mobile
  var sb = document.getElementById("sidebar"), bd = document.getElementById("sb-bd");
  document.getElementById("sb-open").addEventListener("click", function(){ sb.classList.add("open"); bd.classList.add("open"); });
  bd.addEventListener("click", function(){ sb.classList.remove("open"); bd.classList.remove("open"); });

  var ORDERS = [
    { id:"#DF-0847", d:"Air Fusion 01 +2 articles", date:"5 août 2026", total:"417,00 €", st:"shipped", stl:"Expédiée" },
    { id:"#DF-0821", d:"Urbano Low", date:"28 juil. 2026", total:"129,00 €", st:"done", stl:"Livrée" },
    { id:"#DF-0790", d:"Volta Pro +1 article", date:"14 juil. 2026", total:"338,00 €", st:"done", stl:"Livrée" },
    { id:"#DF-0765", d:"Pace X Runner", date:"2 juil. 2026", total:"169,00 €", st:"canceled", stl:"Annulée" }
  ];
  document.getElementById("orders-list").innerHTML = ORDERS.map(function(o,i){
    return '<div class="order-item reveal" style="--i:'+i+'">'
      + '<div class="o-thumb">'+o.id.slice(-2)+'</div>'
      + '<div style="flex:1"><strong>'+o.id+'</strong><div class="muted" style="font-size:.85rem">'+o.d+' · '+o.date+'</div></div>'
      + '<span class="status '+o.st+'">'+o.stl+'</span>'
      + '<strong style="min-width:90px;text-align:right">'+o.total+'</strong></div>';
  }).join("");
  // conteneur stagger
  document.getElementById("orders-list").classList.add("stagger");
  window.DFReveal && DFReveal();
</script>
</body>
</html>

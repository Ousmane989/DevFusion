<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#2e3192">
  <link rel="icon" href="/img/favicon.png" type="image/png">

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="/css/app.css">

<body>
  <div class="app">
    <aside class="menu" id="menu">
      <div class="marque">
        <img class="logo-ecole" id="logo-menu" src="/img/embleme.png" alt="">
        <div><b id="nom-ecole">Keur Xaleyi</b><small id="role-user"></small></div>
      </div>
      <nav id="nav"></nav>
      <div class="pied">
        <div id="nom-user" class="gras"></div>
        <button class="btn lien cache" style="color:#fff" data-installer="menu">📲 Installer l'application</button><br>
        <button class="btn lien" style="color:#fff" id="btn-mdp">Changer mon mot de passe</button><br>
        <button class="btn lien" style="color:#fff" id="btn-deco">Se déconnecter</button>
      </div>
    </aside>
    <div class="voile cache" id="voile"></div>
    <div class="contenu">
      <header class="barre">
        <button class="btn clair petit seul-mobile" id="btn-menu" aria-label="Menu">☰</button>
        <div class="titre" id="titre">Chargement…</div>
        <button class="btn petit clair cache" title="Mettre l'application sur l'écran d'accueil" aria-label="Installer l'application" data-installer="court">📲<span class="si-large"> Installer</span></button>
        <span class="annee" id="annee"></span>
      </header>
      <main class="page" id="page"></main>
    </div>
    <nav class="nav-bas" id="nav-bas"></nav>
  </div>
  <div id="toasts"></div>
  <script src="/js/installer.js"></script>
  <script type="module" src="/js/app.js"></script>

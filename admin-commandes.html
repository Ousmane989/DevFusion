<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commandes — DevFusion Pro</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sb-bd"></div>
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="brand" data-no-transition><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 16 3-8 6 3 5-7 6 4-2 8H4z"/></svg></span> DevFusion</a>
    <div class="side-label">Pilotage</div>
    <nav class="side-nav">
      <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Vue d'ensemble</a>
      <a href="admin-produits.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg> Produits</a>
      <a href="admin-commandes.html" class="is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg> Commandes</a>
      <a href="admin-clients.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg> Clients</a>
      <div class="side-sep"></div>
      <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg> Retour au site</a>
    </nav>
  </aside>

  <div>
    <div class="topbar">
      <button class="icon-btn side-toggle" id="sb-open" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="input" placeholder="Rechercher une commande…"></div>
      <div class="avatar">OB</div>
    </div>

    <div class="main-area page-fade">
      <div class="page-title reveal"><h1>Commandes</h1><p>Suivez et mettez à jour le statut des commandes.</p></div>

      <div class="filter-row reveal" style="margin-bottom:18px">
        <button class="chip-filter active">Toutes</button>
        <button class="chip-filter">En attente</button>
        <button class="chip-filter">Expédiées</button>
        <button class="chip-filter">Livrées</button>
        <button class="chip-filter">Annulées</button>
      </div>

      <div class="grid stagger" id="orders" style="gap:12px"></div>
    </div>
  </div>
</div>

<script src="js/animations.js"></script>
<script src="js/ui.js"></script>
<script>
  var sb = document.getElementById("sidebar"), bd = document.getElementById("sb-bd");
  document.getElementById("sb-open").addEventListener("click", function(){ sb.classList.add("open"); bd.classList.add("open"); });
  bd.addEventListener("click", function(){ sb.classList.remove("open"); bd.classList.remove("open"); });

  // Filtres (visuel)
  document.querySelector(".filter-row").addEventListener("click", function(e){
    var b = e.target.closest(".chip-filter"); if(!b) return;
    this.querySelectorAll(".chip-filter").forEach(function(c){ c.classList.remove("active"); });
    b.classList.add("active");
  });

  var CYCLE = [["pending","En attente"],["shipped","Expédiée"],["done","Livrée"]];
  var ORDERS = [
    { id:"#DF-0847", c:"Awa Diallo", items:"3 articles", date:"5 août 2026", total:"417,00 €", stIdx:1 },
    { id:"#DF-0846", c:"Karim Benali", items:"1 article", date:"5 août 2026", total:"149,00 €", stIdx:0 },
    { id:"#DF-0845", c:"Léa Martin", items:"2 articles", date:"4 août 2026", total:"298,00 €", stIdx:2 },
    { id:"#DF-0844", c:"Yusuf Cissé", items:"1 article", date:"4 août 2026", total:"169,00 €", stIdx:2 }
  ];

  var wrap = document.getElementById("orders");
  wrap.innerHTML = ORDERS.map(function(o,i){
    return '<div class="panel reveal" style="padding:0" data-order="'+i+'">'
      + '<div class="order-item" style="border:none;cursor:pointer" onclick="toggleDetail('+i+')">'
      + '<div class="o-thumb">'+o.id.slice(-2)+'</div>'
      + '<div style="flex:1"><strong>'+o.id+'</strong><div class="muted" style="font-size:.85rem">'+o.c+' · '+o.items+' · '+o.date+'</div></div>'
      + '<span class="status '+CYCLE[o.stIdx][0]+'" id="st-'+i+'">'+CYCLE[o.stIdx][1]+'</span>'
      + '<strong style="min-width:90px;text-align:right">'+o.total+'</strong>'
      + '<span class="chev" id="chev-'+i+'" style="transition:transform .24s"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span>'
      + '</div>'
      + '<div class="expand" id="exp-'+i+'"><div style="padding:0 16px 16px">'
      + '<div class="divider" style="margin-bottom:14px"></div>'
      + '<div class="flex items-center justify-between wrap gap"><div><div class="muted" style="font-size:.8rem">Client</div><strong>'+o.c+'</strong></div>'
      + '<div><div class="muted" style="font-size:.8rem">Contenu</div><strong>'+o.items+'</strong></div>'
      + '<div><div class="muted" style="font-size:.8rem">Total</div><strong>'+o.total+'</strong></div></div>'
      + '<div class="flex gap" style="margin-top:16px"><button class="btn btn-sm" onclick="advance(event,'+i+')">Faire avancer le statut</button>'
      + '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();DFToast.info(\'Facture\',\'Téléchargement (démo).\')">Facture</button></div>'
      + '</div></div></div>';
  }).join("");
  window.DFReveal && DFReveal();

  window.toggleDetail = function(i){
    document.getElementById("exp-"+i).classList.toggle("open");
    var ch = document.getElementById("chev-"+i);
    ch.style.transform = ch.style.transform ? "" : "rotate(180deg)";
  };
  window.advance = function(e, i){
    e.stopPropagation();
    ORDERS[i].stIdx = Math.min(ORDERS[i].stIdx + 1, CYCLE.length - 1);
    var el = document.getElementById("st-"+i);
    el.className = "status " + CYCLE[ORDERS[i].stIdx][0] + " status-swap";
    el.textContent = CYCLE[ORDERS[i].stIdx][1];
    void el.offsetWidth; el.classList.add("status-swap");
    DFToast.success("Statut mis à jour", ORDERS[i].id + " → " + CYCLE[ORDERS[i].stIdx][1]);
  };
</script>
</body>
</html>
